name: End-to-End Test ASJ

on:
  workflow_dispatch:

jobs:
  test-end-to-end:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install GDAL library
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev

      - name: Run end to end tests
        env:
          URS_USERNAME: ${{ secrets.URS_USERNAME }}
          URS_PASSWORD: ${{ secrets.URS_PASSWORD }}
          AWS_DEFAULT_REGION: us-west-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -r requirements/requirements-test.txt GDAL==3.4.1
          pytest -s tests_e2e/test_gdal.py --stack-name=teatest-jenk-same
